name: Build Flopper Zero EXE
on:
  push:
    paths:
      - "windows-app/**"
      - ".github/workflows/build-flopper-windows.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish Windows app
        run: dotnet publish windows-app/FlopperZero.Windows/FlopperZero.Windows.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true
      - uses: actions/upload-artifact@v4
        with:
          name: FlopperZero-Windows-x64
          path: windows-app/FlopperZero.Windows/bin/Release/net8.0-windows/win-x64/publish/
          if-no-files-found: error
