name: Build ESP32-WROOM firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries
        run: |
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"

      - name: Compile for ESP32-WROOM-32
        run: |
          mkdir -p build/FlopperZero
          cp flopper_zero_marauder.ino build/FlopperZero/FlopperZero.ino
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir bin build/FlopperZero

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: flopper-zero-esp32-wroom-bin
          path: bin/
          if-no-files-found: error
          retention-days: 14
